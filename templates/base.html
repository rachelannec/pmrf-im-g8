<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/philhealth.css') }}">
</head>

<body>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* This places a thin 35% white tint over your image to balance the vibrancy */
            background-image: linear-gradient(rgba(245, 247, 250, 0.20), rgba(245, 247, 250, 0.20)), 
                            url("{{ url_for('static', filename='images/prism_bg.png') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>

    <nav class="top-nav" style="position: relative; z-index: 1000; background: var(--surface); border-bottom: 1px solid var(--border-light);">
        <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1120px; margin: 0 auto; padding: 0 20px; height: 64px;">
            
            <div class="nav-logo" style="display: flex; align-items: center; gap: 12px;">
                <img src="{{ url_for('static', filename='images/prism_logo.png') }}" 
                     alt="PRISM Logo" 
                     style="height: 40px; width: auto; object-fit: contain;">
                     
                <div style="display: flex; flex-direction: column;">
                    <span class="logo-text" style="font-size: 22px; font-weight: 800; color: var(--primary); line-height: 1;">PRISM</span>
                    <span style="font-size: 11px; color: var(--text-muted); font-weight: 500; margin-top: 4px;">PhilHealth Registration and Information System Management</span>
                </div>
            </div>

            <button id="menu-toggle-btn" style="background: none; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; padding: 8px;" aria-label="Open Sidebar Menu">
                <span class="material-symbols-outlined" style="font-size: 30px;">menu</span>
            </button>
        </div>
    </nav>

    <div id="sidebar-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); z-index: 1999; opacity: 0; transition: opacity 0.3s ease;"></div>

    <div id="side-drawer" style="position: fixed; top: 0; right: -300px; width: 300px; height: 100vh; background: var(--surface); box-shadow: -4px 0 12px rgba(0,0,0,0.15); z-index: 2000; transition: right 0.3s ease-in-out; display: flex; flex-direction: column;">
        
        <div style="display: flex; justify-content: flex-end; padding: 16px 20px; border-bottom: 1px solid var(--border-light);">
            <button id="menu-close-btn" style="background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center;" aria-label="Close Sidebar Menu">
                <span class="material-symbols-outlined" style="font-size: 28px;">close</span>
            </button>
        </div>

        <div style="display: flex; flex-direction: column; padding: 20px 0;">
            <a href="/" class="sidebar-link" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 16px; transition: background 0.2s, color 0.2s;">
                <span class="material-symbols-outlined" style="color: var(--primary);">login</span> Log In
            </a>
            <a href="#" class="sidebar-link" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 16px; transition: background 0.2s, color 0.2s;">
                <span class="material-symbols-outlined" style="color: var(--secondary);">info</span> About Us
            </a>
            <a href="#" class="sidebar-link" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 16px; transition: background 0.2s, color 0.2s;">
                <span class="material-symbols-outlined" style="color: var(--text-muted);">help</span> Help
            </a>
        </div>
    </div>

    <main style="flex: 1;">
        {% block content %}{% endblock %}
    </main>

    <footer style="margin-top: auto; padding: 24px 20px; background: var(--surface); border-top: 1px solid var(--border-light); text-align: center;">
        <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center;">
            <p style="margin: 0; font-size: 14px; color: var(--text-main); font-weight: 500;">
                &copy; 2026 Database Project • PRISM Portal
            </p>
            <p style="margin: 0; font-size: 12px; color: var(--text-muted); font-style: italic;">
                This is developed for educational presentation purposes only. All rights reserved.
            </p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuBtn = document.getElementById('menu-toggle-btn');
            const closeBtn = document.getElementById('menu-close-btn');
            const drawer = document.getElementById('side-drawer');
            const overlay = document.getElementById('sidebar-overlay');

            function openSidebar() {
                overlay.style.display = 'block';
                setTimeout(() => {
                    overlay.style.opacity = '1';
                    drawer.style.right = '0';
                }, 10);
            }

            function closeSidebar() {
                drawer.style.right = '-300px';
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 300);
            }

            menuBtn.addEventListener('click', openSidebar);
            closeBtn.addEventListener('click', closeSidebar);
            overlay.addEventListener('click', closeSidebar);

            const links = drawer.querySelectorAll('.sidebar-link');
            links.forEach(link => {
                link.addEventListener('mouseenter', () => {
                    link.style.background = 'var(--surface-alt)';
                    link.style.paddingLeft = '28px';
                });
                link.addEventListener('mouseleave', () => {
                    link.style.background = 'transparent';
                    link.style.paddingLeft = '24px';
                });
            });
        });
    </script>
</body>
</html>
