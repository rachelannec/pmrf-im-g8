<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Flask Form to SQLite{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #18212f;
        --muted: #5f6b7a;
        --border: #d7dee8;
        --accent: #1457d1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #e9f1ff 0%, var(--bg) 35%, #eef3f8 100%);
        color: var(--text);
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px 60px;
      }

      .hero {
        margin-bottom: 24px;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(215, 222, 232, 0.9);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(24, 33, 47, 0.08);
        padding: 24px;
        margin-bottom: 24px;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
        background: #fff;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
        width: fit-content;
      }

      .flash {
        padding: 12px 14px;
        border-radius: 12px;
        background: #e8f2ff;
        color: #0f3f99;
        margin-bottom: 16px;
      }

      .entries {
        display: grid;
        gap: 14px;
      }

      .entry {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
      }

      .entry h3 {
        margin: 0 0 6px;
        font-size: 1rem;
      }

      .meta {
        color: var(--muted);
        font-size: 0.92rem;
        margin-bottom: 8px;
      }

      .empty {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
