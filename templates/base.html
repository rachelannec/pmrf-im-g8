<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhilHealth Portal</title>
    
    <!-- Load Public Sans Font -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Load Material Symbols for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Link to our custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/philhealth.css') }}">
</head>
<body>
    <!-- Global Header -->
    <header class="top-nav">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="material-symbols-outlined logo-icon">health_and_safety</span>
                <span class="logo-text">PhilHealth Portal</span>
            </div>
            <div class="nav-links">
                <a href="#" class="active">Registration</a>
                <a href="#">Benefits</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </div>
            <div class="nav-actions">
                <button class="btn-text">Help</button>
                <button class="btn-login">Login</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area where forms are injected -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Global Footer -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-brand">
                <span class="footer-logo">PhilHealth Portal</span>
                <p>© 2024 Philippine Health Insurance Corporation. All rights reserved.</p>
            </div>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Transparency Seal</a>
                <a href="#">Citizen's Charter</a>
                <a href="#">Contact Us</a>
            </div>
        </div>
    </footer>
</body>
</html>
