{% extends "base.html" %}
{% block content %}
<main style="padding-top: 0;">
    <div class="form-card" style="max-width: 450px; margin: 60px auto;">
        <div class="form-header" style="text-align: center;">
            <span class="material-symbols-outlined" style="font-size: 48px; color: var(--primary); margin-bottom: 12px;">account_circle</span>
            <h1>Member Sign In</h1>
            <p>Sign in with your PhilHealth ID or Email and password to update your details.</p>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-light); margin: 24px 0;">

        {% if error_message %}
        <div class="alert alert-error">
            <span class="material-symbols-outlined">error</span> {{ error_message }}
        </div>
        {% endif %}

        <form method="post" action="/login/member">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="member-pin">PhilHealth ID Number (PIN) or Email Address</label>
                <input type="text" id="member-pin" name="PIN" class="form-control" placeholder="PIN or email address" autocomplete="username" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 24px;">
                <label for="member-pass">Password</label>
                <input type="password" id="member-pass" name="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn-submit" style="width: 100%;">Sign In</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/" style="font-size: 14px; color: var(--text-muted); text-decoration: none;">← Back to Portal Selection</a>
        </div>
    </div>
</main>
{% endblock %}
