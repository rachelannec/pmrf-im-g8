{% extends "base.html" %}
{% block content %}
<main style="padding-top: 0;">
    <div class="form-card" style="max-width: 450px; margin: 60px auto;">
        <div class="form-header" style="text-align: center;">
            <span class="material-symbols-outlined" style="font-size: 48px; color: var(--primary); margin-bottom: 12px;">account_circle</span>
            <h1>Member Sign In</h1>
            <p>View your existing membership records or update profile data.</p>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-light); margin: 24px 0;">

        <form onsubmit="event.preventDefault();">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="member-pin">PhilHealth ID Number (PIN)</label>
                <input type="text" id="member-pin" class="form-control" placeholder="PH-XXXXXXXXX-X" autocomplete="off">
            </div>
            
            <div class="form-group" style="margin-bottom: 24px;">
                <label for="member-pass">Password</label>
                <input type="password" id="member-pass" class="form-control" placeholder="Enter password">
            </div>

            <button type="button" class="btn-submit" style="width: 100%;">Sign In</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/" style="font-size: 14px; color: var(--text-muted); text-decoration: none;">← Back to Portal Selection</a>
        </div>
    </div>
</main>
{% endblock %}
