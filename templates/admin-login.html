<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PhilHealth Portal</title>
    <style>
        :root {
            --ph-green: #007F3D;
            --bg-light: #F8F9FA;
            --text-main: #212529;
            --border-color: #DEE2E6;
        }
        
        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: var(--ph-green);
            margin: 0 0 5px 0;
            font-size: 1.5rem;
        }

        .login-header p {
            color: #6C757D;
            margin: 0;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--ph-green);
            box-shadow: 0 0 0 3px rgba(0, 127, 61, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--ph-green);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #006631;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #1A73E8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Admin Portal</h2>
            <p>Sign in to view submitted PMRF data</p>
        </div>

        <!-- Update action to your Flask login route (e.g., /admin/auth) -->
        <form action="/admin/dashboard" method="POST">
            <div class="form-group">
                <label for="username">Username / Employee ID</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <a href="/" class="back-link">← Back to Public Registration</a>
    </div>

</body>
</html>
